version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ztech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ztech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ztech_secure_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ztech_downloader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ztech} -d ${POSTGRES_DB:-ztech_downloader}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ztech-network

  redis:
    image: redis:7-alpine
    container_name: ztech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ztech-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ztech-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ztech}:${POSTGRES_PASSWORD:-ztech_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-ztech_downloader}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - downloads_data:/app/downloads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ztech-network
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ztech-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ztech}:${POSTGRES_PASSWORD:-ztech_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-ztech_downloader}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - downloads_data:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - ztech-network
    command: python -m app.workers.runner
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ztech-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ztech-network
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  downloads_data:

networks:
  ztech-network:
    driver: bridge
